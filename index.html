<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل القنوات الرياضية - العبودي TV</title>
    
    <!-- مكتبات المشغل وفك التشفير -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        .telegram-btn:hover {
            background-color: #0077b5;
            transform: translateY(-2px);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .artplayer-app {
            width: 100%;
            height: 100%;
        }

        .channels-section {
            padding: 20px;
        }

        .channels-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #94a3b8;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .channel-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background-color: #475569;
        }

        .channel-btn.active {
            background-color: #0284c7;
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>مشغل البث المباشر</h1>
        <a href="https://t.me/stlaet1" target="_blank" class="telegram-btn">
            انضم إلى قناة العبودي TV
        </a>
    </div>

    <div class="main-container">
        <div class="video-wrapper">
            <div class="artplayer-app"></div>
        </div>

        <div class="channels-section">
            <div class="channels-title">اختر القناة:</div>
            <div class="channels-grid">
                <button class="channel-btn active" onclick="changeChannel('https://go-tv.site/live/gotv/12345/41.m3u8', this)">بين سبورت 1</button>
                <button class="channel-btn" onclick="changeChannel('https://go-tv.site/live/gotv/12345/42.m3u8', this)">بين سبورت 2</button>
                <button class="channel-btn" onclick="changeChannel('https://go-tv.site/live/gotv/12345/43.m3u8', this)">بين سبورت 3</button>
                <button class="channel-btn" onclick="changeChannel('https://go-tv.site/live/gotv/12345/44.m3u8', this)">بين سبورت 4</button>
                <button class="channel-btn" onclick="changeChannel('https://go-tv.site/live/gotv/12345/45.m3u8', this)">بين سبورت 5</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://abodirhom.hsinnzaer5.workers.dev";

        function getProxiedUrl(rawUrl) {
            return `${WORKER_URL}/?url=${encodeURIComponent(rawUrl)}`;
        }

        function playHls(video, url, art) {
            if (Hls.isSupported()) {
                if (art.hls) art.hls.destroy();
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 60,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600,
                    maxBufferSize: 60 * 1000 * 1000,
                    manifestLoadingTimeOut: 10000,
                    fragLoadingTimeOut: 20000
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                art.hls = hls;
                art.on('destroy', () => hls.destroy());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        }

        const initialChannelUrl = 'https://go-tv.site/live/gotv/12345/41.m3u8';

        const art = new Artplayer({
            container: '.artplayer-app',
            url: getProxiedUrl(initialChannelUrl),
            type: 'm3u8',
            customType: {
                m3u8: playHls,
            },
            isLive: true,
            autoplay: true,
            muted: true,
            fullscreen: true,
            fullscreenWeb: true,
            volume: 0.8,
            pip: true,
            setting: true,
            airplay: true,
            theme: '#38bdf8'
        });

        function changeChannel(rawUrl, buttonElement) {
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            art.switchUrl(getProxiedUrl(rawUrl));
        }
    </script>
</body>
</html>

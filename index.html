<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العبودي TV</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

<style>
:root {
  --bg-1: #0a0a12;
  --bg-2: #141622;
  --yellow: #ffcc00;
  --text: #ffffff;
}

body {
  margin: 0;
  font-family: 'Almarai', sans-serif;
  background: var(--bg-1);
  color: var(--text);
}

header {
  position: sticky;
  top: 0;
  background: #10121a;
  border-bottom: 2px solid var(--yellow);
  padding: 12px 15px;
  text-align: center;
  z-index: 1000;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--yellow);
}

#group-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 10px;
  background: #12141c;
  white-space: nowrap;
}

#group-tabs::-webkit-scrollbar { height: 4px; }
#group-tabs::-webkit-scrollbar-thumb { background: var(--yellow); }

.group-btn {
  background: #1c1e29;
  color: #fff;
  border: 1px solid rgba(255, 204, 0, 0.3);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
}

.group-btn.active {
  background: var(--yellow);
  color: #000;
  font-weight: bold;
  border-color: var(--yellow);
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
  padding: 12px;
}

.channel-card {
  background: var(--bg-2);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
}

.channel-card img {
  width: 45px;
  height: 45px;
  object-fit: contain;
  margin-bottom: 6px;
}

.chan-title {
  font-size: 11px;
  font-weight: 700;
  height: 28px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  color: #eee;
}

.player-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 2000;
  padding: 10px;
}

.player-box {
  width: 100%;
  max-width: 800px;
  background: #000;
  border: 1px solid var(--yellow);
  border-radius: 10px;
  overflow: hidden;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #181922;
  padding: 10px 14px;
}

.player-title {
  font-size: 13px;
  font-weight: bold;
  color: var(--yellow);
}

.close-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
}

.artplayer-app {
  width: 100%;
  aspect-ratio: 16 / 9;
}

.status-box {
  text-align: center;
  padding: 40px 15px;
  color: var(--yellow);
  font-size: 14px;
}
</style>
</head>
<body>

<header>
  <div class="logo">العبودي TV</div>
</header>

<div id="group-tabs"></div>
<div id="statusMsg" class="status-box">جاري الاتصال بالسيرفر وجلب القنوات...</div>
<div class="channels-grid" id="channelsGrid"></div>

<div class="player-modal" id="playerModal">
  <div class="player-box">
    <div class="player-header">
      <span class="player-title" id="pTitle">مشغل البث</span>
      <button class="close-btn" onclick="closePlayer()">&times;</button>
    </div>
    <div class="artplayer-app" id="artplayer"></div>
  </div>
</div>

<script>
const m3uUrl = "https://go-tv.site/get.php?username=gotv&password=12345&type=m3u_plus";
let art = null;

async function loadChannels() {
  const status = document.getElementById("statusMsg");
  const proxy = "https://corsproxy.io/?" + encodeURIComponent(m3uUrl);

  try {
    const res = await fetch(proxy);
    if (!res.ok) throw new Error("تعذر الوصول للسيرفر");
    const data = await res.text();
    parseAndRender(data);
  } catch (err) {
    status.innerHTML = "حدث خطأ أثناء جلب القنوات، تأكد من فتح الصفحة عبر رابط إنترنت (HTTP/HTTPS) وليس من مسار التخزين الداخلي.";
  }
}

function parseAndRender(data) {
  document.getElementById("statusMsg").style.display = "none";
  const lines = data.split('\n');
  const channels = [];
  let current = null;

  for (let line of lines) {
    line = line.trim();
    if (line.startsWith('#EXTINF:')) {
      const name = line.split(',').pop() || "قناة";
      const logo = (line.match(/tvg-logo="(.*?)"/) || [])[1] || "";
      const group = (line.match(/group-title="(.*?)"/) || [])[1] || "عام";
      current = { name, logo, group };
    } else if (line.startsWith('http') && current) {
      current.url = line;
      channels.push(current);
      current = null;
    }
  }

  const groups = [...new Set(channels.map(c => c.group))];
  const tabs = document.getElementById("group-tabs");
  tabs.innerHTML = "";

  groups.forEach((group, i) => {
    const btn = document.createElement("button");
    btn.className = "group-btn";
    btn.textContent = group;
    btn.onclick = () => {
      document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      displayChannels(channels.filter(c => c.group === group));
    };
    tabs.appendChild(btn);
    if (i === 0) btn.click();
  });
}

function displayChannels(filtered) {
  const grid = document.getElementById("channelsGrid");
  grid.innerHTML = "";

  filtered.forEach(ch => {
    const card = document.createElement("div");
    card.className = "channel-card";
    card.innerHTML = `
      <img src="${ch.logo || 'https://via.placeholder.com/80/000/ffcc00?text=TV'}" onerror="this.src='https://via.placeholder.com/80/000/ffcc00?text=TV'">
      <div class="chan-title">${ch.name}</div>
    `;
    card.onclick = () => openPlayer(ch.url, ch.name);
    grid.appendChild(card);
  });
}

function openPlayer(url, title) {
  document.getElementById("pTitle").textContent = title;
  document.getElementById("playerModal").style.display = "flex";

  if (art) art.destroy();

  art = new Artplayer({
    container: '#artplayer',
    url: url,
    isLive: true,
    autoplay: true,
    fullscreen: true,
    theme: '#ffcc00',
    type: url.includes('.m3u8') ? 'm3u8' : (url.includes('.ts') ? 'ts' : 'auto'),
    customType: {
      m3u8: function(video, url, artInstance) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          artInstance.hls = hls;
          artInstance.on('destroy', () => hls.destroy());
        } else {
          video.src = url;
        }
      },
      ts: function(video, url, artInstance) {
        if (mpegts.isSupported()) {
          const player = mpegts.createPlayer({ type: 'mse', isLive: true, url: url });
          player.attachMediaElement(video);
          player.load();
          player.play();
          artInstance.tsPlayer = player;
          artInstance.on('destroy', () => player.destroy());
        }
      }
    }
  });
}

function closePlayer() {
  document.getElementById("playerModal").style.display = "none";
  if (art) {
    art.destroy();
    art = null;
  }
}

loadChannels();
</script>
</body>
</html>
